<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Shelf — Floorball Board</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100dvh; overflow: hidden; background: #000; }

    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      color: #fff;
    }

    /* Board fills all available space */
    #mount {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #mount svg { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }

    /* ── Tool status bar (floating pill, top-center) ─────────────────────────── */
    .editor-bar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: rgba(28,28,30,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      white-space: nowrap;
      max-width: calc(100vw - 32px);
    }
    .editor-bar code {
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 0.72rem;
      color: rgba(174,214,241,0.9);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Tool bar action buttons ─────────────────────────────────────────────── */
    .tbar-btn {
      padding: 5px 11px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.09);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .tbar-btn:active { background: rgba(255,255,255,0.2); }

    /* ── Bottom tab bar ──────────────────────────────────────────────────────── */
    .tab-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      background: rgba(18,18,20,0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid rgba(255,255,255,0.1);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 10px 4px 8px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.38);
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
    }
    .tab-btn svg { width: 22px; height: 22px; }
    .tab-btn.active { color: #4a9eff; }

    /* ── Sheet backdrop ──────────────────────────────────────────────────────── */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
    }
    .sheet-backdrop.open { display: block; }

    /* ── Sheet ───────────────────────────────────────────────────────────────── */
    .sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 150;
      background: rgba(26,26,28,0.98);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: 16px 16px 0 0;
      border-top: 0.5px solid rgba(255,255,255,0.1);
      padding: 8px 16px 80px;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 75vh;
      overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 0 auto 14px;
    }

    .sheet-section {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
      margin: 12px 0 8px;
    }
    .sheet-section:first-of-type { margin-top: 0; }

    .sheet-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
      align-items: center;
    }

    /* ── Sheet buttons ───────────────────────────────────────────────────────── */
    .sbtn {
      padding: 9px 16px;
      border-radius: 10px;
      border: 1.5px solid;
      background: transparent;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .sbtn:active { opacity: 0.65; }
    .sbtn.active { color: #111 !important; }
    .sbtn:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-layer          { border-color: #4a90b8; color: #4a90b8; }
    .btn-layer.active   { background: #4a90b8; }
    .btn-shoot          { border-color: #e8c840; color: #e8c840; }
    .btn-shoot.active   { background: #e8c840; }
    .btn-ideal          { border-color: #40c880; color: #40c880; }
    .btn-lang           { border-color: #888; color: #888; min-width: 52px; }
    .btn-lang.active    { background: #888; }
    .btn-reset          { border-color: #c06060; color: #c06060; }
    .btn-capture        { border-color: #58d68d; color: #58d68d; }
    .btn-anim           { border-color: #e87040; color: #e87040; }
    .btn-anim.active    { background: #e87040; }
    .btn-editor         { border-color: #d4ac0d; color: #d4ac0d; }
    .btn-editor.active  { background: #d4ac0d; }
    .btn-poly           { border-color: #a080e8; color: #a080e8; }
    .btn-poly.active    { background: #a080e8; }
    .btn-line           { border-color: #40c8e8; color: #40c8e8; }
    .btn-line.active    { background: #40c8e8; }

    /* ── Scene subtitle overlay ─────────────────────────────────────────────── */
    #scene-subtitle {
      display: none;
      position: fixed;
      bottom: calc(60px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 8px 20px;
      border-top: 0.5px solid rgba(255,255,255,0.12);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      z-index: 20;
      white-space: normal;
    }
    #scene-subtitle.visible { display: block; }
    .sub-title { font-weight: 600; margin-bottom: 2px; }
    .sub-desc  { opacity: 0.85; font-size: 12px; line-height: 1.4; }

    /* ── Size control ────────────────────────────────────────────────────────── */
    .size-control {
      display: flex;
      align-items: center;
      border: 1.5px solid #666;
      border-radius: 10px;
      overflow: hidden;
    }
    .size-control button {
      border: none;
      border-radius: 0;
      padding: 7px 14px;
      background: transparent;
      color: #aaa;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }
    .size-control button:active { background: rgba(255,255,255,0.1); }
    #size-display {
      padding: 0 10px;
      font-size: 0.85rem;
      color: #aaa;
      min-width: 36px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div id="mount"></div>

  <div id="scene-subtitle">
    <div id="sub-title-text" class="sub-title"></div>
    <div id="sub-desc-text"  class="sub-desc"></div>
  </div>

  <!-- Active tool status bar -->
  <div id="editor-bar" class="editor-bar">
    <code id="zone-coords">—</code>
    <button id="btn-poly-close" class="tbar-btn" style="display:none">Close</button>
    <button id="btn-poly-undo"  class="tbar-btn" style="display:none">Undo</button>
    <button id="btn-poly-clear" class="tbar-btn" style="display:none">Clear</button>
    <button id="btn-copy-coords" class="tbar-btn">Copy</button>
    <button id="btn-anim-play"  class="tbar-btn" style="display:none">Play</button>
    <button id="btn-anim-reset" class="tbar-btn" style="display:none">Reset</button>
    <button id="btn-anim-clear" class="tbar-btn" style="display:none">Clear</button>
  </div>

  <!-- Sheet backdrop -->
  <div id="sheet-backdrop" class="sheet-backdrop"></div>

  <!-- Scenes sheet -->
  <div id="sheet-scenes" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-section">Scenarios</div>
    <div class="sheet-row">
      <button id="btn-scenario-neutral"    class="sbtn btn-layer">Neutral</button>
      <button id="btn-scenario-def"        class="sbtn btn-layer">Deep 2:1:2</button>
      <button id="btn-scenario-press"      class="sbtn btn-layer">Forecheck</button>
      <button id="btn-scenario-atk"        class="sbtn btn-layer">Triangles</button>
      <button id="btn-scenario-corner"     class="sbtn btn-layer">Corner</button>
    </div>
    <div class="sheet-section">Scripted</div>
    <div class="sheet-row">
      <button id="btn-scenario-transition" class="sbtn btn-anim">Transition</button>
    </div>
    <div class="sheet-section">Training</div>
    <div class="sheet-row">
      <button id="btn-scenario-backcheck"   class="sbtn btn-anim">2:1 Backcheck</button>
      <button id="btn-scenario-hokey-pokey" class="sbtn btn-anim">Hokey-Pokey</button>
      <button id="btn-scenario-wing"        class="sbtn btn-anim">Wing Decision</button>
      <button id="btn-scenario-dbl-pass"    class="sbtn btn-anim">360° Pass</button>
      <button id="btn-scenario-laufduell"   class="sbtn btn-anim">Laufduell</button>
      <button id="btn-scenario-trans43"     class="sbtn btn-anim">4:3 Transition</button>
    </div>
  </div>

  <!-- Layers sheet -->
  <div id="sheet-layers" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-section">Field</div>
    <div class="sheet-row">
      <button id="btn-rink"       class="sbtn btn-layer active">Rink</button>
      <button id="btn-zones"      class="sbtn btn-layer active">Zones (R)</button>
      <button id="btn-zones-left" class="sbtn btn-layer">Zones (L)</button>
    </div>
    <div class="sheet-section">Goalie Zones</div>
    <div class="sheet-row">
      <button id="btn-zone-slot"                class="sbtn btn-layer">Slot (L)</button>
      <button id="btn-zone-slot-right"          class="sbtn btn-layer">Slot (R)</button>
      <button id="btn-zone-danger"              class="sbtn btn-layer">Danger (L)</button>
      <button id="btn-zone-danger-right"        class="sbtn btn-layer">Danger (R)</button>
      <button id="btn-zone-passing-first"       class="sbtn btn-layer">Passing-First (L)</button>
      <button id="btn-zone-passing-first-right" class="sbtn btn-layer">Passing-First (R)</button>
      <button id="btn-zone-attention"           class="sbtn btn-layer">Attention (R→L)</button>
      <button id="btn-zone-attention-right"     class="sbtn btn-layer">Attention (L→R)</button>
      <button id="btn-zone-awareness-left"      class="sbtn btn-layer">Awareness (L)</button>
      <button id="btn-zone-awareness"           class="sbtn btn-layer">Awareness (R)</button>
    </div>
    <div class="sheet-section">Queue Zones</div>
    <div class="sheet-row">
      <button id="btn-zone-queue-left"  class="sbtn btn-layer">Queue (Home)</button>
      <button id="btn-zone-queue-right" class="sbtn btn-layer">Queue (Away)</button>
    </div>
  </div>

  <!-- Tools sheet -->
  <div id="sheet-tools" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-section">Drawing</div>
    <div class="sheet-row">
      <button id="btn-poly-editor" class="sbtn btn-poly">Polygon</button>
      <button id="btn-line-editor" class="sbtn btn-line">Line</button>
      <button id="btn-anim-editor" class="sbtn btn-anim">Animate</button>
    </div>
    <div class="sheet-section">Analysis</div>
    <div class="sheet-row">
      <button id="btn-edit-danger"  class="sbtn btn-editor">Edit Danger Zone</button>
      <button id="btn-edit-passing" class="sbtn btn-editor">Edit Passing Zone</button>
      <button id="btn-shoot"        class="sbtn btn-shoot">Shooting Line</button>
      <button id="btn-ideal"        class="sbtn btn-ideal" disabled>Ideal Pos</button>
    </div>
  </div>

  <!-- Board sheet -->
  <div id="sheet-board" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-section">Setup</div>
    <div class="sheet-row">
      <button id="btn-clear-board"   class="sbtn btn-reset">Clear Board</button>
      <button id="btn-add-attacker"  class="sbtn btn-anim">+ Attacker</button>
      <button id="btn-add-defender"  class="sbtn btn-shoot">+ Defender</button>
      <button id="btn-add-cone"      class="sbtn btn-layer">+ Cone</button>
      <button id="btn-clear-cones"   class="sbtn btn-reset">Clear Cones</button>
    </div>
    <div class="sheet-section">Export</div>
    <div class="sheet-row">
      <button id="btn-capture-home" class="sbtn btn-capture">Cap Home</button>
      <button id="btn-capture-away" class="sbtn btn-capture">Cap Away</button>
      <button id="btn-capture-all"  class="sbtn btn-capture">Cap All</button>
      <button id="btn-png"          class="sbtn btn-capture">PNG</button>
    </div>
    <div class="sheet-section">Settings</div>
    <div class="sheet-row">
      <button id="btn-lang"       class="sbtn btn-lang">EN</button>
      <button id="btn-reset"      class="sbtn btn-reset">Reset</button>
      <button id="btn-reset-zoom" class="sbtn btn-reset">Reset Zoom</button>
      <div class="size-control">
        <button id="btn-size-dec">−</button>
        <span   id="size-display">40</span>
        <button id="btn-size-inc">+</button>
      </div>
    </div>
  </div>

  <!-- Bottom tab bar -->
  <nav class="tab-bar">
    <button class="tab-btn" data-sheet="scenes">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="8" height="8" rx="1.5"/><rect x="12" y="2" width="8" height="8" rx="1.5"/>
        <rect x="2" y="12" width="8" height="8" rx="1.5"/><rect x="12" y="12" width="8" height="8" rx="1.5"/>
      </svg>
      <span>Scenes</span>
    </button>
    <button class="tab-btn" data-sheet="layers">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 11l9-5 9 5-9 5-9-5z"/><path d="M2 15.5l9 5 9-5"/><path d="M2 6.5l9-5 9 5"/>
      </svg>
      <span>Layers</span>
    </button>
    <button class="tab-btn" data-sheet="tools">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15.5 2.5l4 4-11 11H5v-3.5l11.5-11z"/>
      </svg>
      <span>Tools</span>
    </button>
    <button class="tab-btn" data-sheet="board">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
        <line x1="4" y1="6" x2="18" y2="6"/>
        <line x1="4" y1="11" x2="18" y2="11"/>
        <line x1="4" y1="16" x2="18" y2="16"/>
        <circle cx="9" cy="6" r="2.25" fill="currentColor" stroke="none"/>
        <circle cx="14" cy="11" r="2.25" fill="currentColor" stroke="none"/>
        <circle cx="8" cy="16" r="2.25" fill="currentColor" stroke="none"/>
      </svg>
      <span>Board</span>
    </button>
  </nav>

  <script type="module">
    import { FloorballBoard } from './src/index.js';

    const board = new FloorballBoard(document.getElementById('mount'));
    let lang     = 'en';
    let shooting = false;
    let tokenSize = 40;
    let _attackerCount = 0;
    let _defenderCount = 0;

    const $ = id => document.getElementById(id);

    const LAYER_BTNS = {
      'rink':                    'btn-rink',
      'zones':                   'btn-zones',
      'zones-left':              'btn-zones-left',
      'zone-attention':          'btn-zone-attention',
      'zone-awareness':          'btn-zone-awareness',
      'zone-passing-first':      'btn-zone-passing-first',
      'zone-danger':             'btn-zone-danger',
      'zone-slot':               'btn-zone-slot',
      'zone-attention-right':    'btn-zone-attention-right',
      'zone-awareness-left':     'btn-zone-awareness-left',
      'zone-passing-first-right':'btn-zone-passing-first-right',
      'zone-danger-right':       'btn-zone-danger-right',
      'zone-slot-right':         'btn-zone-slot-right',
      'zone-queue-left':         'btn-zone-queue-left',
      'zone-queue-right':        'btn-zone-queue-right',
    };

    function syncLayerButtons(activeLayers) {
      for (const [layer, btnId] of Object.entries(LAYER_BTNS)) {
        const btn = $(btnId);
        if (btn) btn.classList.toggle('active', !!activeLayers[layer]);
      }
      shooting = false;
      $('btn-shoot').classList.remove('active');
      $('btn-ideal').disabled = true;
    }

    const SCENARIO_BTNS = ['btn-scenario-neutral','btn-scenario-def','btn-scenario-press','btn-scenario-atk','btn-scenario-corner','btn-scenario-transition','btn-scenario-backcheck','btn-scenario-hokey-pokey','btn-scenario-wing','btn-scenario-dbl-pass','btn-scenario-laufduell','btn-scenario-trans43'];
    function setActiveScenarioBtn(activeId) {
      SCENARIO_BTNS.forEach(id => $(id).classList.toggle('active', id === activeId));
    }

    $('btn-scenario-neutral').addEventListener('click', () => {
      board.loadScenario('neutral');
      syncLayerButtons({ rink: true });
      setActiveScenarioBtn('btn-scenario-neutral');
    });
    $('btn-scenario-def').addEventListener('click', () => {
      board.loadScenario('defensiv-212');
      syncLayerButtons({ rink: true, 'zone-slot': true });
      setActiveScenarioBtn('btn-scenario-def');
    });
    $('btn-scenario-press').addEventListener('click', () => {
      board.loadScenario('forechecking');
      syncLayerButtons({ rink: true });
      setActiveScenarioBtn('btn-scenario-press');
    });
    $('btn-scenario-atk').addEventListener('click', () => {
      board.loadScenario('triangle-attack');
      syncLayerButtons({ rink: true, 'zone-slot-right': true });
      setActiveScenarioBtn('btn-scenario-atk');
    });
    $('btn-scenario-corner').addEventListener('click', () => {
      board.loadScenario('corner-play');
      syncLayerButtons({ rink: true, 'zone-slot-right': true });
      setActiveScenarioBtn('btn-scenario-corner');
    });

    $('btn-rink').addEventListener('click', () => {
      const on = $('btn-rink').classList.toggle('active');
      board.setLayer('rink', on);
    });

    $('btn-zones').addEventListener('click', () => {
      const on = $('btn-zones').classList.toggle('active');
      board.setLayer('zones', on);
    });

    $('btn-zone-attention').addEventListener('click', () => {
      const on = $('btn-zone-attention').classList.toggle('active');
      board.setLayer('zone-attention', on);
    });

    $('btn-zone-awareness').addEventListener('click', () => {
      const on = $('btn-zone-awareness').classList.toggle('active');
      board.setLayer('zone-awareness', on);
    });

    $('btn-zone-passing-first').addEventListener('click', () => {
      const on = $('btn-zone-passing-first').classList.toggle('active');
      board.setLayer('zone-passing-first', on);
    });

    $('btn-zone-danger').addEventListener('click', () => {
      const on = $('btn-zone-danger').classList.toggle('active');
      board.setLayer('zone-danger', on);
    });

    $('btn-zone-slot').addEventListener('click', () => {
      const on = $('btn-zone-slot').classList.toggle('active');
      board.setLayer('zone-slot', on);
    });

    $('btn-zones-left').addEventListener('click', () => {
      const on = $('btn-zones-left').classList.toggle('active');
      board.setLayer('zones-left', on);
    });

    $('btn-zone-attention-right').addEventListener('click', () => {
      const on = $('btn-zone-attention-right').classList.toggle('active');
      board.setLayer('zone-attention-right', on);
    });

    $('btn-zone-awareness-left').addEventListener('click', () => {
      const on = $('btn-zone-awareness-left').classList.toggle('active');
      board.setLayer('zone-awareness-left', on);
    });

    $('btn-zone-passing-first-right').addEventListener('click', () => {
      const on = $('btn-zone-passing-first-right').classList.toggle('active');
      board.setLayer('zone-passing-first-right', on);
    });

    $('btn-zone-danger-right').addEventListener('click', () => {
      const on = $('btn-zone-danger-right').classList.toggle('active');
      board.setLayer('zone-danger-right', on);
    });

    $('btn-zone-slot-right').addEventListener('click', () => {
      const on = $('btn-zone-slot-right').classList.toggle('active');
      board.setLayer('zone-slot-right', on);
    });

    $('btn-zone-queue-left').addEventListener('click', () => {
      const on = $('btn-zone-queue-left').classList.toggle('active');
      board.setLayer('zone-queue-left', on);
    });

    $('btn-zone-queue-right').addEventListener('click', () => {
      const on = $('btn-zone-queue-right').classList.toggle('active');
      board.setLayer('zone-queue-right', on);
    });

    $('btn-shoot').addEventListener('click', () => {
      shooting = !shooting;
      board.setShootingLine(shooting);
      $('btn-shoot').classList.toggle('active', shooting);
      $('btn-ideal').disabled = !shooting;
    });

    $('btn-ideal').addEventListener('click', () => {
      board.moveGoalieToIdealPosition();
    });

    $('btn-lang').addEventListener('click', () => {
      lang = lang === 'en' ? 'de' : 'en';
      board.setLang(lang);
      $('btn-lang').textContent = lang.toUpperCase();
      $('btn-lang').classList.toggle('active', lang === 'de');
      if ($('scene-subtitle').classList.contains('visible') && animTool.scriptedScene) {
        const sc = animTool.scriptedScene;
        $('sub-title-text').textContent = sc.title?.[lang] ?? sc.title?.en ?? '';
        $('sub-desc-text').textContent  = sc.description?.[lang] ?? sc.description?.en ?? '';
      }
    });

    $('btn-reset').addEventListener('click', () => {
      board.reset();
      shooting = false;
      $('btn-shoot').classList.remove('active');
      $('btn-ideal').disabled = true;
    });

    $('btn-reset-zoom').addEventListener('click', () => {
      board.resetZoom();
    });

    $('btn-clear-board').addEventListener('click', () => {
      board.setPlayers([]);
      board.setOpponents([]);
      _attackerCount = 0;
      _defenderCount = 0;
    });

    $('btn-add-cone').addEventListener('click', () => {
      board.addCone(600, 350);
    });

    $('btn-clear-cones').addEventListener('click', () => {
      board.clearCones();
    });

    $('btn-add-attacker').addEventListener('click', () => {
      _attackerCount++;
      const newDef = { id: `player-custom-${_attackerCount}`, label: `A${_attackerCount}`, x: 44, y: 155 + (_attackerCount - 1) * 55 };
      board.setPlayers([...board.getPositions().players, newDef]);
    });

    $('btn-add-defender').addEventListener('click', () => {
      _defenderCount++;
      const newDef = { id: `opponent-custom-${_defenderCount}`, label: `D${_defenderCount}`, x: 1156, y: 155 + (_defenderCount - 1) * 55 };
      board.setOpponents([...board.getPositions().opponents, newDef]);
    });

    function captureAndCopy(scope, btn) {
      const pos = board.getPositions();
      const fmt = (key, arr) => {
        const lines = arr.map(p => {
          const parts = [`id: '${p.id}'`];
          if (p.label)  parts.push(`label: '${p.label}'`);
          if (p.symbol) parts.push(`symbol: '${p.symbol}'`);
          parts.push(`x: ${p.x}`, `y: ${p.y}`);
          if (p.angle)  parts.push(`angle: ${p.angle}`);
          return `  { ${parts.join(', ')} }`;
        }).join(',\n');
        return `${key}: [\n${lines}\n]`;
      };
      let snippet;
      if (scope === 'home') snippet = fmt('players',   pos.players);
      if (scope === 'away') snippet = fmt('opponents', pos.opponents);
      if (scope === 'all')  snippet = fmt('players', pos.players) + ',\n' + fmt('opponents', pos.opponents);
      navigator.clipboard.writeText(snippet).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      });
    }

    $('btn-capture-home').addEventListener('click', (e) => captureAndCopy('home', e.currentTarget));
    $('btn-capture-away').addEventListener('click', (e) => captureAndCopy('away', e.currentTarget));
    $('btn-capture-all' ).addEventListener('click', (e) => captureAndCopy('all',  e.currentTarget));

    $('btn-png').addEventListener('click', () => {
      const svg = document.querySelector('#mount svg');
      if (!svg) return;
      const W = 1200, H = 700;
      const xml  = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const img  = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width  = W * 2;
        canvas.height = H * 2;
        const ctx = canvas.getContext('2d');
        ctx.scale(2, 2);
        ctx.drawImage(img, 0, 0, W, H);
        URL.revokeObjectURL(url);
        canvas.toBlob(b => {
          const a = document.createElement('a');
          a.download = 'floorball-board.png';
          a.href = URL.createObjectURL(b);
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }, 'image/png');
      };
      img.src = url;
    });

    $('btn-size-dec').addEventListener('click', () => {
      tokenSize = Math.max(20, tokenSize - 5);
      board.setTokenSize(tokenSize);
      $('size-display').textContent = tokenSize;
    });

    $('btn-size-inc').addEventListener('click', () => {

      $('size-display').textContent = tokenSize;

    board.on('tokenMoved', ({ id, x, y }) => {
      console.log('moved', id, Math.round(x), Math.round(y));
    });

    // ── Zone editor ───────────────────────────────────────────────────────────
    const editor = { active: false, dragging: false, side: 'right', offsetX: 0 };
    const NS = 'http://www.w3.org/2000/svg';

    const getSvg       = ()        => document.querySelector('#mount svg');
    const getZoneFill  = name      => getSvg()?.querySelector(`[id$="-zone-${name}-fill"]`);
    const getZoneLabel = name      => getSvg()?.querySelector(`[id$="-zone-${name}-label"]`);
    const toSvgX       = (svg, cx) => {
      const pt = svg.createSVGPoint();
      pt.x = cx; pt.y = 0;
      return pt.matrixTransform(svg.getScreenCTM().inverse()).x;
    };

    function refreshHandleEl(side, edgeX, midY) {
      const g = document.getElementById(`zone-edit-handle-${side}`);
      if (!g) return;
      g.querySelector('.edit-line').setAttribute('x1', edgeX);
      g.querySelector('.edit-line').setAttribute('x2', edgeX);
      g.querySelector('.edit-pill').setAttribute('x', edgeX - 8);
      g.querySelector('.edit-hit').setAttribute('x', edgeX - 16);
      g.querySelectorAll('.edit-dot').forEach((dot, i) => {
        dot.setAttribute('cx', edgeX);
        dot.setAttribute('cy', midY + (i - 1) * 9);
      });
    }

    function refreshHandle() {
      const fill = getZoneFill('danger');
      if (!fill) return;
      const x    = parseFloat(fill.getAttribute('x'));
      const w    = parseFloat(fill.getAttribute('width'));
      const y    = parseFloat(fill.getAttribute('y'));
      const h    = parseFloat(fill.getAttribute('height'));
      const midY = y + h / 2;
      refreshHandleEl('left',  x,     midY);
      refreshHandleEl('right', x + w, midY);
      const xi = Math.round(x), wi = Math.round(w);
      $('zone-coords').textContent =
        `x="${xi}" y="${Math.round(y)}" width="${wi}" height="${Math.round(h)}" rx="50"   →  left: ${xi}  right: ${xi + wi}`;
    }

    function makeHandleGroup(side, edgeX, y, h) {
      const midY = y + h / 2;
      const g    = document.createElementNS(NS, 'g');
      g.setAttribute('id', `zone-edit-handle-${side}`);
      g.style.cursor = 'ew-resize';

      const hit = document.createElementNS(NS, 'rect');
      hit.setAttribute('class', 'edit-hit');
      hit.setAttribute('x', edgeX - 16); hit.setAttribute('y', y);
      hit.setAttribute('width', 32);     hit.setAttribute('height', h);
      hit.setAttribute('fill', 'transparent');

      const line = document.createElementNS(NS, 'line');
      line.setAttribute('class', 'edit-line');
      line.setAttribute('x1', edgeX); line.setAttribute('y1', y);
      line.setAttribute('x2', edgeX); line.setAttribute('y2', y + h);
      line.setAttribute('stroke', 'rgba(255,255,255,0.75)');
      line.setAttribute('stroke-width', 2);
      line.setAttribute('stroke-dasharray', '8,5');
      line.setAttribute('pointer-events', 'none');

      const pill = document.createElementNS(NS, 'rect');
      pill.setAttribute('class', 'edit-pill');
      pill.setAttribute('x', edgeX - 8); pill.setAttribute('y', midY - 22);
      pill.setAttribute('width', 16);    pill.setAttribute('height', 44);
      pill.setAttribute('rx', 5);
      pill.setAttribute('fill', 'white');
      pill.setAttribute('stroke', '#666');
      pill.setAttribute('stroke-width', 1.5);
      pill.setAttribute('pointer-events', 'none');

      for (let i = 0; i < 3; i++) {
        const dot = document.createElementNS(NS, 'circle');
        dot.setAttribute('class', 'edit-dot');
        dot.setAttribute('cx', edgeX);
        dot.setAttribute('cy', midY + (i - 1) * 9);
        dot.setAttribute('r', 2.5);
        dot.setAttribute('fill', '#999');
        dot.setAttribute('pointer-events', 'none');
        g.appendChild(dot);
      }
      g.appendChild(hit);
      g.appendChild(line);
      g.appendChild(pill);

      g.addEventListener('mousedown', e => {
        e.preventDefault(); e.stopPropagation();
        const f  = getZoneFill('danger');
        const ex = side === 'right'
          ? parseFloat(f.getAttribute('x')) + parseFloat(f.getAttribute('width'))
          : parseFloat(f.getAttribute('x'));
        editor.offsetX  = toSvgX(getSvg(), e.clientX) - ex;
        editor.side     = side;
        editor.dragging = true;
      });

      return g;
    }

    function createHandles() {
      if (document.getElementById('zone-edit-handle-right')) return;
      const svg  = getSvg();
      const fill = getZoneFill('danger');
      if (!svg || !fill) return;
      const x = parseFloat(fill.getAttribute('x'));
      const w = parseFloat(fill.getAttribute('width'));
      const y = parseFloat(fill.getAttribute('y'));
      const h = parseFloat(fill.getAttribute('height'));
      svg.appendChild(makeHandleGroup('left',  x,     y, h));
      svg.appendChild(makeHandleGroup('right', x + w, y, h));
    }

    function removeHandles() {
      document.getElementById('zone-edit-handle-left')?.remove();
      document.getElementById('zone-edit-handle-right')?.remove();
    }

    $('btn-edit-danger').addEventListener('click', () => {
      editor.active = !editor.active;
      $('btn-edit-danger').classList.toggle('active', editor.active);
      if (editor.active) {
        board.setLayer('zone-danger', true);
        $('btn-zone-danger').classList.add('active');
        createHandles();
        refreshHandle();
        $('editor-bar').style.display = 'flex';
      } else {
        removeHandles();
        $('editor-bar').style.display = 'none';
      }
    });

    document.addEventListener('mousemove', e => {
      if (!editor.dragging) return;
      const svg  = getSvg();
      const fill = getZoneFill('danger');
      if (!svg || !fill) return;
      const cur        = toSvgX(svg, e.clientX) - editor.offsetX;
      const x          = parseFloat(fill.getAttribute('x'));
      const w          = parseFloat(fill.getAttribute('width'));
      const rightEdge  = x + w;
      if (editor.side === 'right') {
        fill.setAttribute('width', Math.round(Math.max(x + 50, Math.min(1100, cur)) - x));
      } else {
        const newX = Math.round(Math.max(0, Math.min(rightEdge - 50, cur)));
        fill.setAttribute('x',     newX);
        fill.setAttribute('width', Math.round(rightEdge - newX));
      }
      const label = getZoneLabel('danger');
      if (label) {
        const nx = parseFloat(fill.getAttribute('x'));
        const nw = parseFloat(fill.getAttribute('width'));
        label.setAttribute('x', Math.round(nx + nw / 2));
      }
      refreshHandle();
    });

    document.addEventListener('mouseup', () => { editor.dragging = false; });

    $('btn-copy-coords').addEventListener('click', () => {
      const text = $('zone-coords').textContent.split('→')[0].trim();
      navigator.clipboard?.writeText(text).catch(() => {});
      $('btn-copy-coords').textContent = 'Copied!';
      setTimeout(() => { $('btn-copy-coords').textContent = 'Copy'; }, 1500);
    });

    // ── Passing zone editor ───────────────────────────────────────────────────
    const passEditor = { active: false, dragging: null, offsetX: 0 };

    const getPassFill  = () => getSvg()?.querySelector('[id$="-zone-passing-first-fill"]');
    const getPassLabel = () => getSvg()?.querySelector('[id$="-zone-passing-first-label"]');

    function applyPassGeom(rightX, rx) {
      const fill = getPassFill();
      if (!fill) return;
      fill.setAttribute('width', rightX - 100);
      fill.setAttribute('rx', rx);
      const label = getPassLabel();
      if (label) {
        const cx = Math.round((100 + rightX) / 2);
        label.setAttribute('x', cx);
        label.setAttribute('transform', `rotate(-90,${cx},350)`);
      }
    }

    function refreshPassHandles() {
      const fill = getPassFill();
      if (!fill) return;
      const x     = parseFloat(fill.getAttribute('x'));
      const w     = parseFloat(fill.getAttribute('width'));
      const rx    = parseFloat(fill.getAttribute('rx'));
      const right = x + w;

      const rh = document.getElementById('pass-edit-handle-right');
      if (rh) {
        rh.querySelector('.edit-line').setAttribute('x1', right);
        rh.querySelector('.edit-line').setAttribute('x2', right);
        rh.querySelector('.edit-pill').setAttribute('x', right - 8);
        rh.querySelector('.edit-hit').setAttribute('x', right - 16);
        rh.querySelectorAll('.edit-dot').forEach((d, i) => {
          d.setAttribute('cx', right); d.setAttribute('cy', 350 + (i - 1) * 9);
        });
      }

      // rx handle sits at (x+rx, 100) — the top-edge arc start point
      const rxh = document.getElementById('pass-edit-handle-rx');
      if (rxh) {
        const hx = x + rx;
        rxh.querySelector('circle.rx-hit').setAttribute('cx', hx);
        rxh.querySelector('circle.rx-vis').setAttribute('cx', hx);
        rxh.querySelector('line.rx-line').setAttribute('x1', hx);
        rxh.querySelector('line.rx-line').setAttribute('x2', hx);
      }

      $('zone-coords').textContent =
        `x="100" y="100" width="${Math.round(w)}" height="500" rx="${Math.round(rx)}"   →  right: ${Math.round(right)}  rx: ${Math.round(rx)}`;
    }

    function createPassHandles() {
      if (document.getElementById('pass-edit-handle-right')) return;
      const svg  = getSvg();
      const fill = getPassFill();
      if (!svg || !fill || fill.tagName !== 'rect') return; // only works on rect-based zones
      const x     = parseFloat(fill.getAttribute('x'));
      const w     = parseFloat(fill.getAttribute('width'));
      const rx    = parseFloat(fill.getAttribute('rx'));
      const right = x + w;

      const rg = makeHandleGroup('right', right, 100, 500);
      rg.setAttribute('id', 'pass-edit-handle-right');
      rg.querySelectorAll('.edit-dot').forEach((d, i) =>
        d.setAttribute('cy', 350 + (i - 1) * 9));
      rg.addEventListener('mousedown', e => {
        e.preventDefault(); e.stopPropagation();
        const f   = getPassFill();
        const cur = parseFloat(f.getAttribute('x')) + parseFloat(f.getAttribute('width'));
        passEditor.offsetX  = toSvgX(getSvg(), e.clientX) - cur;
        passEditor.dragging = 'right';
      });
      svg.appendChild(rg);

      // rx handle: circle on the top edge at (x+rx, 100)
      const rxg = document.createElementNS(NS, 'g');
      rxg.setAttribute('id', 'pass-edit-handle-rx');
      rxg.style.cursor = 'ew-resize';

      const rxHit = document.createElementNS(NS, 'circle');
      rxHit.setAttribute('class', 'rx-hit');
      rxHit.setAttribute('cx', x + rx); rxHit.setAttribute('cy', 100);
      rxHit.setAttribute('r', 18); rxHit.setAttribute('fill', 'transparent');

      const rxLine = document.createElementNS(NS, 'line');
      rxLine.setAttribute('class', 'rx-line');
      rxLine.setAttribute('x1', x + rx); rxLine.setAttribute('y1', 86);
      rxLine.setAttribute('x2', x + rx); rxLine.setAttribute('y2', 114);
      rxLine.setAttribute('stroke', 'rgba(255,255,255,0.75)');
      rxLine.setAttribute('stroke-width', 2);
      rxLine.setAttribute('pointer-events', 'none');

      const rxVis = document.createElementNS(NS, 'circle');
      rxVis.setAttribute('class', 'rx-vis');
      rxVis.setAttribute('cx', x + rx); rxVis.setAttribute('cy', 100);
      rxVis.setAttribute('r', 8);
      rxVis.setAttribute('fill', '#f0a060'); rxVis.setAttribute('stroke', 'white');
      rxVis.setAttribute('stroke-width', 2);
      rxVis.setAttribute('pointer-events', 'none');

      rxg.appendChild(rxHit); rxg.appendChild(rxLine); rxg.appendChild(rxVis);
      svg.appendChild(rxg);

      rxg.addEventListener('mousedown', e => {
        e.preventDefault(); e.stopPropagation();
        const f  = getPassFill();
        const hx = parseFloat(f.getAttribute('x')) + parseFloat(f.getAttribute('rx'));
        passEditor.offsetX  = toSvgX(getSvg(), e.clientX) - hx;
        passEditor.dragging = 'rx';
      });
    }

    function removePassHandles() {
      document.getElementById('pass-edit-handle-right')?.remove();
      document.getElementById('pass-edit-handle-rx')?.remove();
    }

    $('btn-edit-passing').addEventListener('click', () => {
      if (editor.active) {
        editor.active = false;
        $('btn-edit-danger').classList.remove('active');
        removeHandles();
      }
      passEditor.active = !passEditor.active;
      $('btn-edit-passing').classList.toggle('active', passEditor.active);
      if (passEditor.active) {
        board.setLayer('zone-passing-first', true);
        $('btn-zone-passing-first').classList.add('active');
        createPassHandles();
        refreshPassHandles();
        $('editor-bar').style.display = 'flex';
      } else {
        removePassHandles();
        $('editor-bar').style.display = 'none';
      }
    });

    document.addEventListener('mousemove', e => {
      if (!passEditor.dragging) return;
      const svg  = getSvg();
      const fill = getPassFill();
      if (!svg || !fill) return;
      const cur   = toSvgX(svg, e.clientX) - passEditor.offsetX;
      const x     = parseFloat(fill.getAttribute('x'));
      const w     = parseFloat(fill.getAttribute('width'));
      const rx    = parseFloat(fill.getAttribute('rx'));
      const right = x + w;
      if (passEditor.dragging === 'right') {
        applyPassGeom(Math.round(Math.max(x + 50, Math.min(1100, cur))), rx);
      } else {
        // cur = x + newRx  →  newRx = cur - x; constrain to [5, w/2, 250]
        const newRx = Math.max(5, Math.min(w / 2, Math.min(250, cur - x)));
        applyPassGeom(right, Math.round(newRx));
      }
      refreshPassHandles();
    });

    document.addEventListener('mouseup', () => { passEditor.dragging = null; });

    // ── Polygon editor ────────────────────────────────────────────────────────
    const poly = { active: false, points: [], closed: false, group: null };

    function toSvgPt(svg, cx, cy) {
      const pt = svg.createSVGPoint();
      pt.x = cx; pt.y = cy;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    function polyPointsStr() {
      return poly.points.map(p => `${p.x},${p.y}`).join(' ');
    }

    function updatePolyCoords() {
      $('zone-coords').textContent = poly.points.length
        ? `points="${polyPointsStr()}"`
        : 'Click on the board to place points. Click the gold dot to close.';
    }

    function renderPoly() {
      if (!poly.group) return;
      // Keep only the overlay (first child); remove the rest
      while (poly.group.children.length > 1) poly.group.lastChild.remove();

      const pts = poly.points;
      if (!pts.length) return;

      // Filled polygon (when closed)
      if (poly.closed && pts.length >= 3) {
        const pg = document.createElementNS(NS, 'polygon');
        pg.setAttribute('points', polyPointsStr());
        pg.setAttribute('fill', 'rgba(160,128,232,0.18)');
        pg.setAttribute('stroke', 'rgba(160,128,232,0.85)');
        pg.setAttribute('stroke-width', 1.5);
        pg.setAttribute('pointer-events', 'none');
        poly.group.appendChild(pg);
      }

      // Edges
      const n = pts.length;
      const edgeCount = poly.closed ? n : n - 1;
      for (let i = 0; i < edgeCount; i++) {
        const a = pts[i], b = pts[(i + 1) % n];
        const ln = document.createElementNS(NS, 'line');
        ln.setAttribute('x1', a.x); ln.setAttribute('y1', a.y);
        ln.setAttribute('x2', b.x); ln.setAttribute('y2', b.y);
        ln.setAttribute('stroke', 'rgba(255,255,255,0.65)');
        ln.setAttribute('stroke-width', 1.5);
        if (!poly.closed) ln.setAttribute('stroke-dasharray', '6,3');
        ln.setAttribute('pointer-events', 'none');
        poly.group.appendChild(ln);
      }

      // Closing-hint ring on first dot when ≥3 points and open
      if (!poly.closed && pts.length >= 3) {
        const ring = document.createElementNS(NS, 'circle');
        ring.setAttribute('cx', pts[0].x); ring.setAttribute('cy', pts[0].y);
        ring.setAttribute('r', 14);
        ring.setAttribute('fill', 'transparent');
        ring.setAttribute('stroke', 'rgba(255,204,0,0.55)');
        ring.setAttribute('stroke-width', 2);
        ring.setAttribute('stroke-dasharray', '4,3');
        ring.setAttribute('pointer-events', 'none');
        poly.group.appendChild(ring);
      }

      // Dots — draggable
      pts.forEach((p, i) => {
        const dot = document.createElementNS(NS, 'circle');
        dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y);
        dot.setAttribute('r', i === 0 ? 7 : 5);
        dot.setAttribute('fill', i === 0 ? '#ffcc00' : 'white');
        dot.setAttribute('stroke', i === 0 ? '#aa8800' : '#555');
        dot.setAttribute('stroke-width', 1.5);
        dot.setAttribute('cursor', 'move');

        dot.addEventListener('mousedown', e => {
          e.preventDefault(); e.stopPropagation();
          const idx = i;
          const onMove = e => {
            const sp = toSvgPt(getSvg(), e.clientX, e.clientY);
            poly.points[idx] = { x: Math.round(sp.x), y: Math.round(sp.y) };
            renderPoly();
            updatePolyCoords();
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });

        poly.group.appendChild(dot);
      });

      updatePolyCoords();
    }

    function activatePoly() {
      const svg = getSvg();
      poly.points = []; poly.closed = false;
      poly.group  = document.createElementNS(NS, 'g');
      poly.group.setAttribute('id', 'poly-editor-group');
      svg.appendChild(poly.group);

      // Transparent overlay — captures clicks on empty board area
      const overlay = document.createElementNS(NS, 'rect');
      overlay.setAttribute('x', 0); overlay.setAttribute('y', 0);
      overlay.setAttribute('width', 1200); overlay.setAttribute('height', 700);
      overlay.setAttribute('fill', 'transparent');
      overlay.setAttribute('cursor', 'crosshair');
      poly.group.appendChild(overlay);

      overlay.addEventListener('click', e => {
        if (poly.closed) return;
        const sp = toSvgPt(getSvg(), e.clientX, e.clientY);
        const x  = Math.round(sp.x), y = Math.round(sp.y);
        // Click near first point → close
        if (poly.points.length >= 3) {
          const dx = x - poly.points[0].x, dy = y - poly.points[0].y;
          if (Math.sqrt(dx*dx + dy*dy) < 20) { closePoly(); return; }
        }
        poly.points.push({ x, y });
        renderPoly();
      });

      $('btn-poly-close').style.display = '';
      $('btn-poly-undo').style.display  = '';
      $('btn-poly-clear').style.display = '';
    }

    function closePoly() {
      if (poly.points.length < 3) return;
      poly.closed = true;
      $('btn-poly-close').style.display = 'none';
      renderPoly();
    }

    function deactivatePoly() {
      document.getElementById('poly-editor-group')?.remove();
      poly.group  = null;
      poly.points = [];
      poly.closed = false;
      $('btn-poly-close').style.display = 'none';
      $('btn-poly-undo').style.display  = 'none';
      $('btn-poly-clear').style.display = 'none';
      $('editor-bar').style.display = 'none';
    }

    $('btn-poly-editor').addEventListener('click', () => {
      // Close other editors
      if (editor.active)     { editor.active = false;     $('btn-edit-danger').classList.remove('active');  removeHandles(); }
      if (passEditor.active) { passEditor.active = false; $('btn-edit-passing').classList.remove('active'); removePassHandles(); }
      if (lineTool.active)   { lineTool.active = false;   $('btn-line-editor').classList.remove('active');  deactivateLineTool(); }

      poly.active = !poly.active;
      $('btn-poly-editor').classList.toggle('active', poly.active);
      if (poly.active) {
        activatePoly();
        $('editor-bar').style.display = 'flex';
        updatePolyCoords();
      } else {
        deactivatePoly();
      }
    });

    $('btn-poly-close').addEventListener('click', closePoly);

    $('btn-poly-undo').addEventListener('click', () => {
      if (poly.closed) { poly.closed = false; $('btn-poly-close').style.display = ''; }
      else             { poly.points.pop(); }
      renderPoly();
    });

    $('btn-poly-clear').addEventListener('click', () => {
      if (lineTool.active) return;
      poly.points = []; poly.closed = false;
      $('btn-poly-close').style.display = '';
      renderPoly();
    });

    // ── Line tool ─────────────────────────────────────────────────────────────
    const lineTool = { active: false, lines: [], placing: false, tempStart: null, group: null };

    function ensureLineArrow(svg) {
      if (svg.querySelector('#line-tool-arrow')) return;
      const defs = svg.querySelector('defs');
      if (!defs) return;
      const marker = document.createElementNS(NS, 'marker');
      marker.setAttribute('id', 'line-tool-arrow');
      marker.setAttribute('markerWidth', '8'); marker.setAttribute('markerHeight', '8');
      marker.setAttribute('refX', '7');        marker.setAttribute('refY', '3');
      marker.setAttribute('orient', 'auto');
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', 'M0,0 L0,6 L8,3 z');
      path.setAttribute('fill', 'rgba(64,200,232,0.9)');
      marker.appendChild(path);
      defs.appendChild(marker);
    }

    function renderLineSegments() {
      if (!lineTool.group) return;
      const preview = lineTool.group.querySelector('#line-tool-preview');
      // Remove everything except overlay (first child) and preview line
      Array.from(lineTool.group.children).forEach(el => {
        if (el !== lineTool.group.firstChild && el.id !== 'line-tool-preview') el.remove();
      });

      lineTool.lines.forEach((seg, li) => {
        const ln = document.createElementNS(NS, 'line');
        ln.setAttribute('x1', seg.x1); ln.setAttribute('y1', seg.y1);
        ln.setAttribute('x2', seg.x2); ln.setAttribute('y2', seg.y2);
        ln.setAttribute('stroke', 'rgba(64,200,232,0.85)');
        ln.setAttribute('stroke-width', '2');
        ln.setAttribute('marker-end', 'url(#line-tool-arrow)');
        ln.setAttribute('pointer-events', 'none');
        lineTool.group.appendChild(ln);

        [['x1','y1',false], ['x2','y2',true]].forEach(([xk, yk, isEnd]) => {
          const dot = document.createElementNS(NS, 'circle');
          dot.setAttribute('cx', seg[xk]); dot.setAttribute('cy', seg[yk]);
          dot.setAttribute('r', 5);
          dot.setAttribute('fill', isEnd ? '#ffcc00' : 'white');
          dot.setAttribute('stroke', isEnd ? '#aa8800' : '#555');
          dot.setAttribute('stroke-width', 1.5);
          dot.setAttribute('cursor', 'move');
          dot.addEventListener('mousedown', e => {
            e.preventDefault(); e.stopPropagation();
            const onMove = ev => {
              const sp = toSvgPt(getSvg(), ev.clientX, ev.clientY);
              lineTool.lines[li][xk] = Math.round(sp.x);
              lineTool.lines[li][yk] = Math.round(sp.y);
              renderLineSegments();
            };
            const onUp = () => {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup',  onUp);
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup',  onUp);
          });
          lineTool.group.appendChild(dot);
        });
      });

      // Anchor dot shown while first click is placed but second hasn't happened yet
      if (lineTool.placing && lineTool.tempStart) {
        const sd = document.createElementNS(NS, 'circle');
        sd.setAttribute('cx', lineTool.tempStart.x); sd.setAttribute('cy', lineTool.tempStart.y);
        sd.setAttribute('r', 5); sd.setAttribute('fill', 'white');
        sd.setAttribute('stroke', '#555');         sd.setAttribute('stroke-width', 1.5);
        sd.setAttribute('pointer-events', 'none');
        lineTool.group.appendChild(sd);
      }

      updateLineCoords();
    }

    function updateLineCoords() {
      const last = lineTool.lines[lineTool.lines.length - 1];
      $('zone-coords').textContent = last
        ? `x1="${last.x1}" y1="${last.y1}" x2="${last.x2}" y2="${last.y2}"`
        : 'Click to place start point, click again to complete the line.';
    }

    function activateLineTool() {
      const svg = getSvg();
      ensureLineArrow(svg);
      lineTool.lines = []; lineTool.placing = false; lineTool.tempStart = null;
      lineTool.group = document.createElementNS(NS, 'g');
      lineTool.group.setAttribute('id', 'line-tool-group');
      svg.appendChild(lineTool.group);

      const overlay = document.createElementNS(NS, 'rect');
      overlay.setAttribute('x', 0); overlay.setAttribute('y', 0);
      overlay.setAttribute('width', 1200); overlay.setAttribute('height', 700);
      overlay.setAttribute('fill', 'transparent');
      overlay.setAttribute('cursor', 'crosshair');
      lineTool.group.appendChild(overlay);

      overlay.addEventListener('click', e => {
        const sp = toSvgPt(getSvg(), e.clientX, e.clientY);
        const x = Math.round(sp.x), y = Math.round(sp.y);
        if (!lineTool.placing) {
          lineTool.tempStart = { x, y };
          lineTool.placing   = true;
          renderLineSegments();
        } else {
          lineTool.lines.push({ x1: lineTool.tempStart.x, y1: lineTool.tempStart.y, x2: x, y2: y });
          lineTool.placing   = false;
          lineTool.tempStart = null;
          lineTool.group.querySelector('#line-tool-preview')?.remove();
          renderLineSegments();
        }
      });

      $('btn-poly-close').style.display = 'none';
      $('btn-poly-undo').style.display  = '';
      $('btn-poly-clear').style.display = '';
    }

    function deactivateLineTool() {
      document.getElementById('line-tool-group')?.remove();
      lineTool.group = null; lineTool.lines = [];
      lineTool.placing = false; lineTool.tempStart = null;
      $('btn-poly-undo').style.display  = 'none';
      $('btn-poly-clear').style.display = 'none';
      $('editor-bar').style.display = 'none';
    }

    // Preview line follows cursor while first point is placed
    document.addEventListener('mousemove', e => {
      if (!lineTool.active || !lineTool.placing || !lineTool.group) return;
      const sp = toSvgPt(getSvg(), e.clientX, e.clientY);
      let preview = lineTool.group.querySelector('#line-tool-preview');
      if (!preview) {
        preview = document.createElementNS(NS, 'line');
        preview.setAttribute('id', 'line-tool-preview');
        preview.setAttribute('stroke', 'rgba(64,200,232,0.4)');
        preview.setAttribute('stroke-width', '1.5');
        preview.setAttribute('stroke-dasharray', '6,3');
        preview.setAttribute('pointer-events', 'none');
        lineTool.group.appendChild(preview);
      }
      preview.setAttribute('x1', lineTool.tempStart.x); preview.setAttribute('y1', lineTool.tempStart.y);
      preview.setAttribute('x2', Math.round(sp.x));     preview.setAttribute('y2', Math.round(sp.y));
    });

    $('btn-line-editor').addEventListener('click', () => {
      if (editor.active)     { editor.active = false;     $('btn-edit-danger').classList.remove('active');  removeHandles(); }
      if (passEditor.active) { passEditor.active = false; $('btn-edit-passing').classList.remove('active'); removePassHandles(); }
      if (poly.active)       { poly.active = false;       $('btn-poly-editor').classList.remove('active');  deactivatePoly(); }

      lineTool.active = !lineTool.active;
      $('btn-line-editor').classList.toggle('active', lineTool.active);
      if (lineTool.active) {
        activateLineTool();
        $('editor-bar').style.display = 'flex';
        updateLineCoords();
      } else {
        deactivateLineTool();
      }
    });

    // Undo: cancel in-progress placement or remove last segment
    $('btn-poly-undo').addEventListener('click', () => {
      if (!lineTool.active) return;
      if (lineTool.placing) {
        lineTool.placing = false; lineTool.tempStart = null;
        lineTool.group.querySelector('#line-tool-preview')?.remove();
        renderLineSegments();
      } else {
        lineTool.lines.pop();
        renderLineSegments();
      }
    });

    // Clear: remove all line segments
    $('btn-poly-clear').addEventListener('click', () => {
      if (!lineTool.active) return;
      lineTool.lines = []; lineTool.placing = false; lineTool.tempStart = null;
      lineTool.group.querySelector('#line-tool-preview')?.remove();
      renderLineSegments();
    });

    // ── Animation tool ────────────────────────────────────────────────────────

    const ANIM_COLOR = {
      player:   'rgba(64,180,255,0.85)',
      opponent: 'rgba(255,100,60,0.85)',
      ball:     'rgba(100,220,80,0.85)',
    };

    const animTool = {
      active: false,
      selected: null,
      paths: new Map(),
      startPositions: null,
      group: null,
      overlay: null,

      scriptedScene: null,

    function renderAnimPaths() {
      if (!animTool.group) return;
      animTool.group.querySelectorAll('.anim-path-el').forEach(el => el.remove());
      animTool.paths.forEach(({ waypoints, type }, tid) => {
        if (waypoints.length < 1) return;
        const color = ANIM_COLOR[type] ?? ANIM_COLOR.player;
        if (waypoints.length > 1) {
          const pts = waypoints.map(p => `${p.x},${p.y}`).join(' ');
          const pl = document.createElementNS(NS, 'polyline');
          pl.setAttribute('points', pts);
          pl.setAttribute('fill', 'none');
          pl.setAttribute('stroke', color);
          pl.setAttribute('stroke-width', '2.5');
          pl.setAttribute('stroke-dasharray', '8,4');
          pl.setAttribute('marker-end', 'url(#line-tool-arrow)');
          pl.setAttribute('pointer-events', 'none');
          pl.classList.add('anim-path-el');
          animTool.group.appendChild(pl);
        }
        waypoints.forEach(p => {
          const c = document.createElementNS(NS, 'circle');
          c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', '4');
          c.setAttribute('fill', color); c.setAttribute('pointer-events', 'none');
          c.classList.add('anim-path-el');
          animTool.group.appendChild(c);
        });
      });
      // Glowing ring around selected token
      if (animTool.selected) {
        const token = getSvg()?.querySelector(`[data-tid="${animTool.selected}"]`);
        if (token) {
          const r = document.createElementNS(NS, 'circle');
          const halfSize = parseFloat(token.querySelector('use')?.getAttribute('width') ?? '50') / 2;
          r.setAttribute('cx', token.dataset.x);
          r.setAttribute('cy', token.dataset.y);
          r.setAttribute('r', halfSize + 4);
          r.setAttribute('fill', 'none');
          r.setAttribute('stroke', 'white');
          r.setAttribute('stroke-width', '2');
          r.setAttribute('stroke-dasharray', '4,2');
          r.setAttribute('opacity', '0.8');
          r.setAttribute('pointer-events', 'none');
          r.classList.add('anim-path-el');
          animTool.group.appendChild(r);
        }
      }
    }

    function activateAnimTool() {
      if (editor.active)     { editor.active = false;     $('btn-edit-danger').classList.remove('active');  removeHandles(); }
      if (passEditor.active) { passEditor.active = false; $('btn-edit-passing').classList.remove('active'); removePassHandles(); }
      if (poly.active)       { poly.active = false;       $('btn-poly-editor').classList.remove('active');  deactivatePoly(); }
      if (lineTool.active)   { lineTool.active = false;   $('btn-line-editor').classList.remove('active');  deactivateLineTool(); }

      const pos = board.getPositions();
      animTool.startPositions = [...pos.players, ...pos.opponents];

      const svg = getSvg();
      ensureLineArrow(svg);

      const g = document.createElementNS(NS, 'g');
      g.setAttribute('id', 'anim-tool-group');
      svg.appendChild(g);
      animTool.group = g;

      const ov = document.createElementNS(NS, 'rect');
      ov.setAttribute('x', '0'); ov.setAttribute('y', '0');
      ov.setAttribute('width', '1200'); ov.setAttribute('height', '700');
      ov.setAttribute('fill', 'transparent');
      ov.setAttribute('pointer-events', 'all');
      g.appendChild(ov);
      animTool.overlay = ov;

      ov.addEventListener('click', e => {
        const sp = toSvgPt(svg, e.clientX, e.clientY);
        const hit = document.elementsFromPoint(e.clientX, e.clientY)
          .reduce((found, el) => found || el.closest?.('[data-tid]'), null);
        if (hit) {
          animTool.selected = hit.dataset.tid;
          if (!animTool.paths.has(hit.dataset.tid)) {
            animTool.paths.set(hit.dataset.tid, {
              waypoints: [{ x: Math.round(parseFloat(hit.dataset.x)), y: Math.round(parseFloat(hit.dataset.y)) }],
              type: hit.dataset.type,
            });
          }
          renderAnimPaths();
        } else if (animTool.selected) {
          animTool.paths.get(animTool.selected).waypoints.push({ x: Math.round(sp.x), y: Math.round(sp.y) });
          renderAnimPaths();
        }
      });

      $('editor-bar').style.display = 'flex';
      $('zone-coords').textContent = 'Select a player, then tap waypoints';
      $('btn-poly-close').style.display = 'none';
      $('btn-poly-undo').style.display  = 'none';
      $('btn-poly-clear').style.display = 'none';
      $('btn-copy-coords').style.display = 'none';
      $('btn-anim-play').style.display  = '';
      $('btn-anim-reset').style.display = '';
      $('btn-anim-clear').style.display = '';
    }

    function deactivateAnimTool() {
      board.stopAnimation();
      animTool.group?.remove();
      animTool.group        = null;
      animTool.overlay      = null;
      animTool.selected     = null;
      animTool.paths.clear();
      animTool.playing      = false;
      animTool.startPositions  = null;
      animTool.scriptedScene   = null;
      animTool.scriptedPlay    = null;
      $('scene-subtitle').classList.remove('visible');
      $('editor-bar').style.display = 'none';
      $('btn-anim-play').style.display  = 'none';
      $('btn-anim-reset').style.display = 'none';
      $('btn-anim-clear').style.display = 'none';
      $('btn-copy-coords').style.display = '';
    }

    $('btn-anim-editor').addEventListener('click', () => {
      animTool.active = !animTool.active;
      $('btn-anim-editor').classList.toggle('active', animTool.active);
      if (animTool.active) activateAnimTool();
      else                 deactivateAnimTool();
    });

    $('btn-anim-play').addEventListener('click', () => {
      if (animTool.playing) return;
      if (animTool.scriptedPlay) { animTool.scriptedPlay(); return; }
      if (animTool.paths.size === 0) return;
      animTool.playing = true;
      $('btn-anim-play').textContent = '▶ Playing…';
      const paths = [...animTool.paths.entries()].map(([id, { waypoints }]) => ({ id, waypoints }));
      board.animatePaths(paths, 1200).then(() => {
        animTool.playing = false;
        $('btn-anim-play').textContent = 'Play';
        renderAnimPaths();
      });
    });

    $('btn-anim-reset').addEventListener('click', () => {
      board.stopAnimation();
      animTool.playing = false;
      $('btn-anim-play').textContent = 'Play';
      if (animTool.scriptedScene) {
        loadScriptedScene(animTool.scriptedScene);
        return;

      if (animTool.startPositions) {
        const players   = animTool.startPositions.filter(p => p.id.startsWith('player-'));
        const opponents = animTool.startPositions.filter(p => p.id.startsWith('opponent-'));
        board.setPlayers(players);
        board.setOpponents(opponents);
        board.reset();
      }
      animTool.paths.clear();
      animTool.selected = null;
      const pos = board.getPositions();
      animTool.startPositions = [...pos.players, ...pos.opponents];
      renderAnimPaths();
    });

    $('btn-anim-clear').addEventListener('click', () => {
      animTool.paths.clear();

    }

    function animateCircle(el, x1, y1, x2, y2, ms) {
      return new Promise(resolve => {
        const start = performance.now();
        (function frame(now) {
          const t = Math.min((now - start) / ms, 1);
          el.setAttribute('cx', x1 + (x2 - x1) * t);
          el.setAttribute('cy', y1 + (y2 - y1) * t);
          if (t < 1) requestAnimationFrame(frame);
          else resolve();
        })(performance.now());
      });
    }

        { id:'opponent-ld', type:'opponent', waypoints:[{x:610,y:190},{x:750,y:245}] },
        { id:'opponent-rd', type:'opponent', waypoints:[{x:610,y:510},{x:750,y:440}] },
      ],
      triangle: [{x:940,y:215},{x:1000,y:350},{x:1025,y:350}],

    function loadScriptedScene(scene) {
      if (scene.scenario) {
        board.loadScenario(scene.scenario);
      } else {
        if (scene.players)   board.setPlayers(scene.players);
        if (scene.opponents) board.setOpponents(scene.opponents);
        board.reset();
      }

      if (animTool.active) {
        animTool.active = false;
        $('btn-anim-editor').classList.remove('active');
        deactivateAnimTool();
      }
      animTool.active = true;
      $('btn-anim-editor').classList.add('active');
      activateAnimTool();

      scene.paths.forEach(({ id, type, waypoints }) => {
        animTool.paths.set(id, { waypoints, type });
      });
      animTool.selected = null;

      const svg = getSvg();
      ensureLineArrow(svg);
      ensurePassArrow(svg);

      const ballEl = document.createElementNS(NS, 'circle');
      ballEl.setAttribute('id', 'scripted-ball');
      ballEl.setAttribute('cx', scene.ballStart.x);
      ballEl.setAttribute('cy', scene.ballStart.y);
      ballEl.setAttribute('r', '8');
      ballEl.setAttribute('fill', 'rgba(255,255,180,0.95)');
      ballEl.setAttribute('stroke', 'rgba(200,200,100,0.9)');
      ballEl.setAttribute('stroke-width', '2');
      ballEl.setAttribute('pointer-events', 'none');
      ballEl.classList.add('scripted-overlay');
      animTool.group.appendChild(ballEl);

      scene.passLines.forEach(({ x1, y1, x2, y2 }) => {
        const ln = document.createElementNS(NS, 'line');
        ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);
        ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);
        ln.setAttribute('stroke', 'rgba(255,220,40,0.82)');
        ln.setAttribute('stroke-width', '2.5');
        ln.setAttribute('stroke-dasharray', '5,4');
        ln.setAttribute('marker-end', 'url(#pass-arrow)');
        ln.setAttribute('pointer-events', 'none');
        ln.classList.add('anim-path-el');
        animTool.group.appendChild(ln);
      });

      if (scene.triangle) {
        const pts = scene.triangle.map(p => `${p.x},${p.y}`).join(' ');
        const tri = document.createElementNS(NS, 'polygon');
        tri.setAttribute('points', pts);
        tri.setAttribute('fill', 'rgba(40,200,80,0.11)');
        tri.setAttribute('stroke', 'rgba(40,200,80,0.82)');
        tri.setAttribute('stroke-width', '2');
        tri.setAttribute('stroke-dasharray', '10,5');
        tri.setAttribute('pointer-events', 'none');
        tri.classList.add('scripted-overlay');
        animTool.group.appendChild(tri);
      }

      renderAnimPaths();

      animTool.scriptedScene = scene;
      animTool.scriptedPlay  = async function () {
        if (animTool.playing) return;
        animTool.playing = true;
        $('btn-anim-play').textContent = '▶ Playing…';

        ballEl.setAttribute('cx', scene.ballStart.x);
        ballEl.setAttribute('cy', scene.ballStart.y);
        animTool.group.querySelectorAll('.anim-path-el').forEach(el => el.remove());

        const phases = scene.ballPhases;
        let prevX = scene.ballStart.x, prevY = scene.ballStart.y;
        for (let i = 0; i < phases.length - 1; i++) {
          await animateCircle(ballEl, prevX, prevY, phases[i].x, phases[i].y, phases[i].ms ?? 350);
          prevX = phases[i].x; prevY = phases[i].y;
        }
        const last = phases[phases.length - 1];
        const dur  = scene.moveDuration ?? 1200;
        const playerPaths = [...animTool.paths.entries()].map(([id, { waypoints }]) => ({ id, waypoints }));
        await Promise.all([
          board.animatePaths(playerPaths, dur),
          animateCircle(ballEl, prevX, prevY, last.x, last.y, dur),
        ]);

        animTool.playing = false;
        $('btn-anim-play').textContent = 'Play';
        renderAnimPaths();
      };

      if (scene.title && scene.description) {
        $('sub-title-text').textContent = scene.title[lang] ?? scene.title.en;
        $('sub-desc-text').textContent  = scene.description[lang] ?? scene.description.en;
        $('scene-subtitle').classList.add('visible');
      }

      closeSheet();
    }

    $('btn-scenario-transition').addEventListener('click', () => {
      loadScriptedScene(TRANSITION_212);
      setActiveScenarioBtn('btn-scenario-transition');
    });

    $('btn-scenario-backcheck').addEventListener('click', () => {

    });

    // ── Sheet navigation ──────────────────────────────────────────────────────
    let activeSheet = null;
    const sheetBackdrop = $('sheet-backdrop');

    function openSheet(name) {
      if (activeSheet === name) { closeSheet(); return; }
      if (activeSheet) document.getElementById(`sheet-${activeSheet}`).classList.remove('open');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.tab-btn[data-sheet="${name}"]`).classList.add('active');
      document.getElementById(`sheet-${name}`).classList.add('open');
      sheetBackdrop.classList.add('open');
      activeSheet = name;
    }
    function closeSheet() {
      if (activeSheet) document.getElementById(`sheet-${activeSheet}`).classList.remove('open');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      sheetBackdrop.classList.remove('open');
      activeSheet = null;
    }
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => openSheet(btn.dataset.sheet));
    });
    sheetBackdrop.addEventListener('click', closeSheet);
  </script>
