<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Shelf — Floorball Board</title>
  <script>try{if(localStorage.getItem('ts.theme')==='editorial')document.documentElement.classList.add('theme-editorial');}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100dvh; overflow: hidden; background: #000; }

    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      color: #fff;
    }

    /* Board fills all available space */
    #mount {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #mount svg { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }

    /* ── Tool status bar (floating pill, top-center) ─────────────────────────── */
    .editor-bar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: rgba(28,28,30,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      white-space: nowrap;
      max-width: calc(100vw - 32px);
    }
    .editor-bar code {
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 0.72rem;
      color: rgba(174,214,241,0.9);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Tool bar action buttons ─────────────────────────────────────────────── */
    .tbar-btn {
      padding: 5px 11px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.09);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .tbar-btn:active { background: rgba(255,255,255,0.2); }

    /* ── Scrub slider ────────────────────────────────────────────────────────── */
    .anim-scrub {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.18);
      outline: none;
      cursor: pointer;
    }
    .anim-scrub::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #39ff14;
      border: 1px solid rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .anim-scrub::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #39ff14;
      border: 1px solid rgba(0,0,0,0.4);
      cursor: pointer;
    }

    /* ── Bottom tab bar ──────────────────────────────────────────────────────── */
    .tab-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      background: rgba(18,18,20,0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid rgba(255,255,255,0.1);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 10px 4px 8px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.38);
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
    }
    .tab-btn svg { width: 22px; height: 22px; }
    .tab-btn.active { color: #4a9eff; }

    /* ── Sheet backdrop ──────────────────────────────────────────────────────── */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
    }
    .sheet-backdrop.open { display: block; }

    /* ── Sheet ───────────────────────────────────────────────────────────────── */
    .sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 150;
      background: rgba(26,26,28,0.98);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: 16px 16px 0 0;
      border-top: 0.5px solid rgba(255,255,255,0.1);
      padding: 8px 16px 80px;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 75vh;
      overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 0 auto 14px;
    }

    .sheet-section {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
      margin: 12px 0 8px;
    }
    .sheet-section:first-of-type { margin-top: 0; }

    .sheet-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
      align-items: center;
    }

    /* ── Sheet buttons ───────────────────────────────────────────────────────── */
    .sbtn {
      padding: 9px 16px;
      border-radius: 10px;
      border: 1.5px solid;
      background: transparent;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .sbtn:active { opacity: 0.65; }
    .sbtn.active { color: #111 !important; }
    .sbtn:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-layer          { border-color: #4a90b8; color: #4a90b8; }
    .btn-layer.active   { background: #4a90b8; }
    .btn-shoot          { border-color: #e8c840; color: #e8c840; }
    .btn-shoot.active   { background: #e8c840; }
    .btn-ideal          { border-color: #40c880; color: #40c880; }
    .btn-lang           { border-color: #888; color: #888; min-width: 52px; }
    .btn-lang.active    { background: #888; }
    .btn-reset          { border-color: #c06060; color: #c06060; }
    .btn-capture        { border-color: #58d68d; color: #58d68d; }
    .btn-anim           { border-color: #e87040; color: #e87040; }
    .btn-anim.active    { background: #e87040; }
    .btn-editor         { border-color: #d4ac0d; color: #d4ac0d; }
    .btn-editor.active  { background: #d4ac0d; }
    .btn-poly           { border-color: #a080e8; color: #a080e8; }
    .btn-poly.active    { background: #a080e8; }
    .btn-line           { border-color: #40c8e8; color: #40c8e8; }
    .btn-line.active    { background: #40c8e8; }

    /* ── Scene subtitle overlay ─────────────────────────────────────────────── */
    #scene-subtitle {
      display: none;
      position: fixed;
      bottom: calc(60px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 8px 20px;
      border-top: 0.5px solid rgba(255,255,255,0.12);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      z-index: 20;
      white-space: normal;
    }
    #scene-subtitle.visible { display: block; }
    .sub-title { font-weight: 600; margin-bottom: 2px; }
    .sub-desc  { opacity: 0.85; font-size: 12px; line-height: 1.4; }

    /* ── Field rotation ─────────────────────────────────────────────────────── */
    #field-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.field-rotated #mount { position: relative; }

    body.field-rotated #field-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      --fh: min(100vw, calc((100dvh - 64px) * 7 / 12));
      width: calc(var(--fh) * 12 / 7);
      height: var(--fh);
      transform: translate(-50%, -50%) rotate(-90deg);
      display: block;
    }

    body.field-rotated #field-wrap svg {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
    }

    .rotate-fab {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 250;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(28,28,30,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .rotate-fab.active {
      color: #4a9eff;
      background: rgba(74,158,255,0.15);
      border-color: rgba(74,158,255,0.5);
    }

    /* ── Size control ────────────────────────────────────────────────────────── */
    .size-control {
      display: flex;
      align-items: center;
      border: 1.5px solid #666;
      border-radius: 10px;
      overflow: hidden;
    }
    .size-control button {
      border: none;
      border-radius: 0;
      padding: 7px 14px;
      background: transparent;
      color: #aaa;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }
    .size-control button:active { background: rgba(255,255,255,0.1); }
    #size-display {
      padding: 0 10px;
      font-size: 0.85rem;
      color: #aaa;
      min-width: 36px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ── Editorial theme (opt-in via html.theme-editorial) ──────────────── */
    html.theme-editorial {
      --paper: #F4F1EA;
      --ink:   #14130F;
      --ink-2: #4A4742;
      --rule:  rgba(20,19,15,0.14);
      --accent:#B23A1A;
      --ochre: #C68A2E;
    }
    html.theme-editorial,
    html.theme-editorial body { background: var(--paper); color: var(--ink); }
    html.theme-editorial body {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
    }

    /* Editor bar */
    html.theme-editorial .editor-bar {
      background: var(--paper);
      border: 1px solid var(--rule);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: 0 1px 2px rgba(20,19,15,0.05);
      border-radius: 4px;
    }
    html.theme-editorial .editor-bar code {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--ink-2);
    }
    html.theme-editorial .tbar-btn {
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--ink);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 3px;
    }
    html.theme-editorial .tbar-btn:hover  { border-color: var(--ink); }
    html.theme-editorial .tbar-btn:active { background: var(--ink); color: var(--paper); }

    /* Scrub slider */
    html.theme-editorial .anim-scrub { background: var(--rule); height: 2px; border-radius: 0; }
    html.theme-editorial .anim-scrub::-webkit-slider-thumb {
      background: var(--accent); border: none; width: 12px; height: 12px;
    }
    html.theme-editorial .anim-scrub::-moz-range-thumb {
      background: var(--accent); border: none; width: 12px; height: 12px;
    }

    /* Tab bar — table of contents */
    html.theme-editorial .tab-bar {
      background: var(--paper);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-top: 1px solid var(--rule);
    }
    html.theme-editorial .tab-btn {
      color: var(--ink-2);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 16px 4px 14px;
      position: relative;
      flex-direction: row;
      gap: 8px;
      justify-content: center;
    }
    html.theme-editorial .tab-btn svg { display: none; }
    html.theme-editorial .tab-btn::before {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ochre);
    }
    html.theme-editorial .tab-btn[data-sheet="scenes"]::before { content: 'I.'; }
    html.theme-editorial .tab-btn[data-sheet="layers"]::before { content: 'II.'; }
    html.theme-editorial .tab-btn[data-sheet="tools"]::before  { content: 'III.'; }
    html.theme-editorial .tab-btn[data-sheet="board"]::before  { content: 'IV.'; }
    html.theme-editorial .tab-btn.active { color: var(--ink); }
    html.theme-editorial .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 50%;
      width: 28px;
      height: 2px;
      background: var(--accent);
      transform: translateX(-50%);
    }

    /* Sheet & backdrop */
    html.theme-editorial .sheet {
      background: var(--paper);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-top: 1px solid var(--rule);
      border-radius: 0;
      color: var(--ink);
      padding: 16px 22px 90px;
    }
    html.theme-editorial .sheet-handle { background: var(--ink-2); opacity: 0.25; }
    html.theme-editorial .sheet-section {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.05rem;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink);
      margin: 18px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--rule);
    }
    html.theme-editorial .sheet-section:first-of-type { margin-top: 4px; }
    html.theme-editorial .sheet-row { gap: 6px; }
    html.theme-editorial .sheet-backdrop.open {
      display: block;
      background: rgba(244,241,234,0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Sheet buttons — typographic, monochrome with category glyphs */
    html.theme-editorial .sbtn {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 3px;
      color: var(--ink);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      font-weight: 500;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      padding: 9px 14px;
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
    }
    html.theme-editorial .sbtn:hover { border-color: var(--ink); }
    html.theme-editorial .sbtn.active {
      background: var(--ink) !important;
      color: var(--paper) !important;
      border-color: var(--ink);
    }
    html.theme-editorial .sbtn::before {
      font-family: 'Fraunces', serif;
      font-size: 0.95em;
      font-weight: 400;
      color: var(--ochre);
      line-height: 1;
    }
    html.theme-editorial .sbtn.active::before { color: var(--paper); }

    html.theme-editorial .btn-layer::before   { content: '\00a7'; }      /* § */
    html.theme-editorial .btn-anim::before    { content: '\25B8'; color: var(--accent); } /* ▸ */
    html.theme-editorial .btn-shoot::before   { content: '\2715'; }      /* ✕ */
    html.theme-editorial .btn-poly::before    { content: '\25B1'; }      /* ▱ */
    html.theme-editorial .btn-line::before    { content: '\2015'; }      /* ― */
    html.theme-editorial .btn-editor::before  { content: '\270E'; }      /* ✎ */
    html.theme-editorial .btn-capture::before { content: '\2761'; }      /* ❡ */
    html.theme-editorial .btn-ideal::before   { content: '\25C9'; }      /* ◉ */
    html.theme-editorial .btn-reset::before   { content: '\21BA'; color: var(--accent); } /* ↺ */
    html.theme-editorial .btn-reset           { border-left: 2px solid var(--accent); }
    html.theme-editorial .btn-lang::before    { content: none; }
    html.theme-editorial .btn-lang,
    html.theme-editorial #btn-theme {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 500;
      letter-spacing: 0.16em;
    }
    html.theme-editorial #btn-theme::before { content: none; }

    /* Override classic colored borders with neutral hairlines */
    html.theme-editorial .btn-layer,
    html.theme-editorial .btn-shoot,
    html.theme-editorial .btn-ideal,
    html.theme-editorial .btn-lang,
    html.theme-editorial .btn-capture,
    html.theme-editorial .btn-anim,
    html.theme-editorial .btn-editor,
    html.theme-editorial .btn-poly,
    html.theme-editorial .btn-line {
      border-color: var(--rule);
      color: var(--ink);
    }
    html.theme-editorial .btn-reset {
      border-color: var(--rule);
      color: var(--ink);
      border-left-color: var(--accent);
    }

    /* Scene subtitle — pull quote */
    html.theme-editorial #scene-subtitle {
      background: transparent;
      border-top: none;
      color: var(--ink);
      padding: 10px 24px 14px;
      bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      max-width: 38ch;
      left: 50%;
      right: auto;
      transform: translateX(-50%);
    }
    html.theme-editorial .sub-title {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.05rem;
      color: var(--ink);
      margin-bottom: 4px;
    }
    html.theme-editorial .sub-desc {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-2);
      opacity: 1;
      line-height: 1.5;
    }

    /* Rotate FAB — paper square */
    html.theme-editorial .rotate-fab {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 3px;
      color: var(--ink);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      width: 32px;
      height: 32px;
    }
    html.theme-editorial .rotate-fab.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    html.theme-editorial .rotate-fab svg { width: 16px; height: 16px; }

    /* Size control */
    html.theme-editorial .size-control {
      border: 1px solid var(--rule);
      border-radius: 3px;
    }
    html.theme-editorial .size-control button { color: var(--ink); }
    html.theme-editorial #size-display {
      color: var(--ink);
      font-family: 'IBM Plex Mono', monospace;
    }
    /* ── Grid coordinate readout ─────────────────────────────────────────────── */
    #grid-readout {
      display: none;
      position: fixed;
      bottom: calc(60px + env(safe-area-inset-bottom, 0px) + 4px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18,18,18,0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      padding: 7px 16px;
      border-radius: 10px;
      border: 0.5px solid rgba(255,255,255,0.18);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      white-space: nowrap;
      z-index: 25;
      pointer-events: none;
    }
    #grid-readout.visible { display: block; }
  </style>
  <script type="module" crossorigin src="/top-shelf/assets/index-CdqsQXtl.js"></script>
</head>
<body>

  <div id="mount">
    <div id="field-wrap"></div>
  </div>

  <button id="btn-rotate-field" class="rotate-fab" title="Rotate field">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 2v6h-6"/>
      <path d="M21 13a9 9 0 1 1-3-7.7L21 8"/>
    </svg>
  </button>

  <div id="scene-subtitle">
    <div id="sub-title-text" class="sub-title"></div>
    <div id="sub-desc-text"  class="sub-desc"></div>
  </div>

  <!-- Active tool status bar -->
  <div id="editor-bar" class="editor-bar">
    <code id="zone-coords">—</code>
    <button id="btn-poly-close" class="tbar-btn" style="display:none">Close</button>
    <button id="btn-poly-undo"  class="tbar-btn" style="display:none">Undo</button>
    <button id="btn-poly-clear" class="tbar-btn" style="display:none">Clear</button>
    <button id="btn-copy-coords" class="tbar-btn">Copy</button>
    <button id="btn-anim-play"  class="tbar-btn" style="display:none">Play</button>
    <button id="btn-anim-pause" class="tbar-btn" style="display:none">Pause</button>
    <button id="btn-anim-step"  class="tbar-btn" style="display:none">⏭</button>
    <button id="btn-anim-speed" class="tbar-btn" style="display:none">1×</button>
    <input  id="anim-scrub"     class="anim-scrub" type="range" min="0" max="1000" value="0" style="display:none">
    <button id="btn-anim-reset" class="tbar-btn" style="display:none">Reset</button>
    <button id="btn-anim-clear" class="tbar-btn" style="display:none">Clear</button>
  </div>

  <!-- Sheet backdrop -->
  <div id="sheet-backdrop" class="sheet-backdrop"></div>

  <!-- Scenes sheet -->
  <div id="sheet-scenes" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-section">Scenarios</div>
    <div class="sheet-row">
      <button id="btn-scenario-neutral"    class="sbtn btn-layer">Neutral</button>
      <button id="btn-scenario-def"        class="sbtn btn-layer">Deep 2:1:2</button>
      <button id="btn-scenario-press"      class="sbtn btn-layer">Forecheck</button>
      <button id="btn-scenario-atk"        class="sbtn btn-layer">Triangles</button>
      <button id="btn-scenario-corner"     class="sbtn btn-layer">Corner</button>
    </div>
    <div id="scenes-list"></div>
  </div>

  <!-- Layers sheet -->
  <div id="sheet-layers" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-section">Field</div>
    <div class="sheet-row">
      <button id="btn-rink"       class="sbtn btn-layer active">Rink</button>
      <button id="btn-zones"      class="sbtn btn-layer">Zones (R)</button>
      <button id="btn-zones-left" class="sbtn btn-layer">Zones (L)</button>
    </div>
    <div class="sheet-section">Goalie Zones</div>
    <div class="sheet-row">
      <button id="btn-zone-slot"                class="sbtn btn-layer">Slot (L)</button>
      <button id="btn-zone-slot-right"          class="sbtn btn-layer">Slot (R)</button>
      <button id="btn-zone-danger"              class="sbtn btn-layer">Danger (L)</button>
      <button id="btn-zone-danger-right"        class="sbtn btn-layer">Danger (R)</button>
      <button id="btn-zone-passing-first"       class="sbtn btn-layer">Passing-First (L)</button>
      <button id="btn-zone-passing-first-right" class="sbtn btn-layer">Passing-First (R)</button>
      <button id="btn-zone-attention"           class="sbtn btn-layer">Attention (R→L)</button>
      <button id="btn-zone-attention-right"     class="sbtn btn-layer">Attention (L→R)</button>
      <button id="btn-zone-awareness-left"      class="sbtn btn-layer">Awareness (L)</button>
      <button id="btn-zone-awareness"           class="sbtn btn-layer">Awareness (R)</button>
    </div>
    <div class="sheet-section">Queue Zones</div>
    <div class="sheet-row">
      <button id="btn-zone-queue-left"  class="sbtn btn-layer">Queue (Home)</button>
      <button id="btn-zone-queue-right" class="sbtn btn-layer">Queue (Away)</button>
    </div>
  </div>

  <!-- Tools sheet -->
  <div id="sheet-tools" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-section">Drawing</div>
    <div class="sheet-row">
      <button id="btn-poly-editor" class="sbtn btn-poly">Polygon</button>
      <button id="btn-line-editor" class="sbtn btn-line">Line</button>
      <button id="btn-anim-editor" class="sbtn btn-anim">Animate</button>
    </div>
    <div class="sheet-section">Analysis</div>
    <div class="sheet-row">
      <button id="btn-edit-danger"  class="sbtn btn-editor">Edit Danger Zone</button>
      <button id="btn-edit-passing" class="sbtn btn-editor">Edit Passing Zone</button>
      <button id="btn-shoot"        class="sbtn btn-shoot">Shooting Line</button>
      <button id="btn-ideal"        class="sbtn btn-ideal" disabled>Ideal Pos</button>
    </div>
    <div class="sheet-section">Dev</div>
    <div class="sheet-row">
      <button id="btn-grid" class="sbtn btn-editor">Grid</button>
    </div>
  </div>

  <!-- Board sheet -->
  <div id="sheet-board" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-section">Setup</div>
    <div class="sheet-row">
      <button id="btn-clear-board"   class="sbtn btn-reset">Clear Board</button>
      <button id="btn-add-attacker"  class="sbtn btn-anim">+ Attacker</button>
      <button id="btn-add-defender"  class="sbtn btn-shoot">+ Defender</button>
      <button id="btn-add-cone"      class="sbtn btn-layer">+ Cone</button>
      <button id="btn-clear-cones"   class="sbtn btn-reset">Clear Cones</button>
    </div>
    <div class="sheet-section">Export</div>
    <div class="sheet-row">
      <button id="btn-capture-home" class="sbtn btn-capture">Cap Home</button>
      <button id="btn-capture-away" class="sbtn btn-capture">Cap Away</button>
      <button id="btn-capture-all"  class="sbtn btn-capture">Cap All</button>
      <button id="btn-png"          class="sbtn btn-capture">PNG</button>
    </div>
    <div class="sheet-section">Settings</div>
    <div class="sheet-row">
      <button id="btn-lang"       class="sbtn btn-lang">EN</button>
      <button id="btn-theme"      class="sbtn btn-lang" title="Toggle theme">CLASSIC</button>
      <button id="btn-reset"      class="sbtn btn-reset">Reset</button>
      <button id="btn-reset-zoom" class="sbtn btn-reset">Reset Zoom</button>
      <div class="size-control">
        <button id="btn-size-dec">−</button>
        <span   id="size-display">40</span>
        <button id="btn-size-inc">+</button>
      </div>
    </div>
  </div>

  <div id="grid-readout"></div>

  <!-- Bottom tab bar -->
  <nav class="tab-bar">
    <button class="tab-btn" data-sheet="scenes">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="8" height="8" rx="1.5"/><rect x="12" y="2" width="8" height="8" rx="1.5"/>
        <rect x="2" y="12" width="8" height="8" rx="1.5"/><rect x="12" y="12" width="8" height="8" rx="1.5"/>
      </svg>
      <span>Scenes</span>
    </button>
    <button class="tab-btn" data-sheet="layers">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 11l9-5 9 5-9 5-9-5z"/><path d="M2 15.5l9 5 9-5"/><path d="M2 6.5l9-5 9 5"/>
      </svg>
      <span>Layers</span>
    </button>
    <button class="tab-btn" data-sheet="tools">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15.5 2.5l4 4-11 11H5v-3.5l11.5-11z"/>
      </svg>
      <span>Tools</span>
    </button>
    <button class="tab-btn" data-sheet="board">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
        <line x1="4" y1="6" x2="18" y2="6"/>
        <line x1="4" y1="11" x2="18" y2="11"/>
        <line x1="4" y1="16" x2="18" y2="16"/>
        <circle cx="9" cy="6" r="2.25" fill="currentColor" stroke="none"/>
        <circle cx="14" cy="11" r="2.25" fill="currentColor" stroke="none"/>
        <circle cx="8" cy="16" r="2.25" fill="currentColor" stroke="none"/>
      </svg>
      <span>Board</span>
    </button>
  </nav>


</body>
</html>
