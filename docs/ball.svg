<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ballGrad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#e0e0e0" />
    </radialGradient>
  </defs>
  <!-- Ballkörper -->
  <circle cx="50" cy="50" r="48" fill="url(#ballGrad)" stroke="#d0d0d0" stroke-width="0.5"/>
  <!-- Die 26 Löcher (beispielhafte Anordnung für die Optik) -->
  <g fill="#333" fill-opacity="0.8">
    <circle cx="50" cy="50" r="4"/>
    <circle cx="50" cy="30" r="4"/><circle cx="50" cy="70" r="4"/>
    <circle cx="30" cy="50" r="4"/><circle cx="70" cy="50" r="4"/>
    <circle cx="36" cy="36" r="4"/><circle cx="64" cy="64" r="4"/>
    <circle cx="36" cy="64" r="4"/><circle cx="64" cy="36" r="4"/>
    <!-- Weitere Löcher für die 26er Optik -->
    <circle cx="50" cy="15" r="3.5"/><circle cx="50" cy="85" r="3.5"/>
    <circle cx="15" cy="50" r="3.5"/><circle cx="85" cy="50" r="3.5"/>
  </g>
</svg>
