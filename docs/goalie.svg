<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" id="player-goalie">
  <!-- Helm-Schale (Etwas massiver und hinten runder als Feldspieler) -->
  <path 
    id="goalie-shell"
    d="M 45 15 C 15 15 10 30 10 50 C 10 70 15 85 45 85 C 65 85 75 75 75 50 C 75 25 65 15 45 15 Z" 
    fill="#ffffff" 
    stroke="#2c5a94" 
    stroke-width="2" 
    cursor="pointer"
  />
  
  <!-- Das Helm-Gitter (Cage) - Zeigt die Blickrichtung (hier nach rechts) -->
  <g id="goalie-cage" pointer-events="none">
    <!-- Äußerer Rahmen des Gitters -->
    <path 
      d="M 65 25 C 95 30 95 70 65 75" 
      fill="none" 
      stroke="#333333" 
      stroke-width="3" 
      stroke-linecap="round"
    />
    <!-- Querstreben des Gitters -->
    <line x1="68" y1="38" x2="88" y2="42" stroke="#333333" stroke-width="2" />
    <line x1="70" y1="50" x2="92" y2="50" stroke="#333333" stroke-width="2" />
    <line x1="68" y1="62" x2="88" y2="58" stroke="#333333" stroke-width="2" />
    <!-- Vertikale Mittelstrebe -->
    <path 
      d="M 75 28 Q 85 50 75 72" 
      fill="none" 
      stroke="#333333" 
      stroke-width="2" 
    />
  </g>

  <!-- Beschriftung 'G' für Goalie -->
  <text 
    x="42" 
    y="58" 
    text-anchor="middle" 
    fill="#2c5a94" 
    font-family="Arial, sans-serif" 
    font-size="24px" 
    font-weight="bold" 
    pointer-events="none"
  >G</text>
</svg>
