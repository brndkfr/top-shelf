<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" id="player-red-base">
  <defs>
    <!-- Filter for a simple dynamic highlight effect -->
    <filter id="hover-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- The Unified Shape (Unified Path of Circle and Beak) -->
  <path 
    id="player-shape"
    d="M 50 10 C 27.9 10 10 27.9 10 50 C 10 72.1 27.9 90 50 90 C 66.8 90 81.3 79.8 87.6 65 L 100 50 L 87.6 35 C 81.3 20.2 66.8 10 50 10 Z"
    fill="#8b1a2a" 
    stroke="#ffffff" 
    stroke-width="2" 
    cursor="pointer"
  />

  <!-- The Player Number/Identifier -->
  <text 
    x="50" 
    y="55" 
    text-anchor="middle" 
    fill="white" 
    font-family="Arial, sans-serif" 
    font-size="28px" 
    font-weight="bold" 
    pointer-events="none"
  >91</text>
</svg>
